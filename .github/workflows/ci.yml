name: ci

# Green CI from commit one. Every PR runs lint, type-check, tests, and a coverage
# gate. A red build does not merge — this is how ten people keep the trunk clean.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ml]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      # Catches a shell escape collapse turning a documented command into a
      # bell character mid-word. Invisible in a diff, invisible in review,
      # and it has already happened twice in this repo.
      - name: Text hygiene
        run: python scripts/check_text_hygiene.py

      - name: Type check (mypy)
        run: mypy src   # strict, and now gating — annotations settled on Day 2

      - name: Test with coverage
        run: pytest --cov=ledger --cov-report=term-missing --cov-fail-under=85

      # The benchmark runs on every push, on the held-out seed. It exits
      # non-zero on a false match, a lost record, or a guessed-at ambiguity —
      # the three ways the headline numbers could look better while being
      # untrue. A regression that breaks correctness fails the build rather
      # than quietly improving the score.
      - name: Benchmark (held-out seed)
        run: python -m ledger.eval.report --events 4000

      # The demo is a graded deliverable, so it is gated like any other. This
      # walks the full path a judge will see and fails the build if any step
      # breaks — a broken demo discovered in CI costs minutes; discovered on
      # stage it costs the submission.
      - name: Demo path
        run: python scripts/demo_check.py
