[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Ledger — an autonomous finance controller. Reconciliation, exceptions, cash forecasting."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "polars>=0.20",       # vectorised dataframe engine for the matching hot path
    "pandas>=2.1",        # interop / connectors
    "rapidfuzz>=3.5",     # fast string similarity for the fuzzy tier (C++ backed)
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.1",      # gradient-boosted classifier for the ambiguous tail
    "numpy>=1.26",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.14",
    "mypy>=1.8",
    "hypothesis>=6.98",   # property-based tests for money invariants
    "httpx2>=0.1",        # starlette TestClient transport (httpx is deprecated there)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests that touch multiple components",
    "slow: tests that run on large synthetic batches",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, strict-but-not-annoying default rule set for a production codebase.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # deliberate str+Enum for stable Pydantic serialization (not StrEnum)
]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares dependencies: `principal: Principal = Depends(...)`. The rule is right
# in general (a mutable default evaluated once) and wrong here — FastAPI resolves
# these per request by design. Scoped to the API package rather than ignored
# globally, so the rule keeps protecting everywhere else.
"src/ledger/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Third-party libs without stubs — don't fail the build over them.
[[tool.mypy.overrides]]
module = ["polars.*", "rapidfuzz.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ledger"]
branch = true

[tool.coverage.report]
# Domain and money code must be near-total; we hold the line here.
fail_under = 85
show_missing = true
